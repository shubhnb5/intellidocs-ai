name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job below is self-contained -- no Qdrant, Redis, Claude API key, or
# MCP server needed. Every test in this repo fakes its external dependency
# at the module-import boundary (fakeredis for Redis, in-memory SQLite for
# the DB, monkeypatched Qdrant/Claude/MCP clients), which is what makes that
# possible. If a future test genuinely needs a live service, add it as a
# `services:` container on that job rather than assuming one is running.
jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  mcp-server:
    name: MCP Server (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mcp-server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
