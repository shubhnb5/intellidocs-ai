# Serves the Vite build output as a single-page app. The one thing that
# actually matters here: react-router-dom's BrowserRouter means routes like
# /login are real paths as far as the browser's concerned, but nginx has no
# file at that path -- try_files falls back to index.html so React Router
# can take over client-side instead of nginx 404ing a hard refresh or a
# direct link to /login.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
